<!DOCTYPE html>
<html>
<head>
    <title>Вход в систему</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #f5f5f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: white; padding: 32px; border-radius: 12px; width: 100%; max-width: 380px; border: 1px solid #e0e0e0; }
        h2 { font-size: 24px; font-weight: 500; margin-bottom: 6px; color: #111; }
        .sub { color: #666; margin-bottom: 28px; font-size: 13px; }
        input { width: 100%; padding: 10px 12px; margin: 6px 0; border: 1px solid #d0d0d0; border-radius: 6px; font-size: 14px; background: #fff; transition: 0.15s; }
        input:focus { outline: none; border-color: #f97316; box-shadow: 0 0 0 2px rgba(249,115,22,0.1); }
        button { width: 100%; padding: 10px; background: #f97316; color: white; border: none; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 16px; transition: background 0.15s; }
        button:hover { background: #ea580c; }
        .error { background: #fef2f2; color: #dc2626; padding: 10px; border-radius: 6px; margin-bottom: 18px; font-size: 13px; text-align: center; border: 1px solid #fecaca; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Вход в систему</h2>
        <div class="sub">Учет оборудования</div>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <input type="text" name="login" placeholder="Логин" required autofocus>
            <input type="password" name="password" placeholder="Пароль" required>
            <button type="submit">Войти</button>
        </form>
    </div>
</body>
</html>
